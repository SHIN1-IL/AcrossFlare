# Cloudflare origin vhosts. $remote_addr is CF-Connecting-IP after real_ip.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name acrossflare.com www.acrossflare.com files.acrossflare.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.acrossflare.com;

    include /etc/nginx/snippets/origin-ssl.conf;
    include /etc/nginx/origin-pulls.conf;

    return 301 https://acrossflare.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name acrossflare.com;

    include /etc/nginx/snippets/origin-ssl.conf;
    include /etc/nginx/origin-pulls.conf;
    include /etc/nginx/snippets/proxy-headers.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Payment webhooks stay on this host and are not VPN-gated.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_read_timeout 120s;
    }
}

# PRD F-4: Nextcloud UI only from the customer VPN (10.8.0.0/24).
# OCS from the web container uses NEXTCLOUD_INTERNAL_URL (http://nextcloud:80) and bypasses this vhost.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name files.acrossflare.com;

    include /etc/nginx/snippets/origin-ssl.conf;
    include /etc/nginx/origin-pulls.conf;
    include /etc/nginx/snippets/proxy-headers.conf;

    allow 10.8.0.0/24;
    deny all;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $files_upstream http://nextcloud:80;
        proxy_pass $files_upstream;
        client_max_body_size 2G;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

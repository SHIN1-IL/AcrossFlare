# Cloudflare origin vhosts. Caddy is the production reverse proxy (infra/caddy/Caddyfile).
# This file is kept only as a fallback reference and is not used by docker-compose.yml.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name acrossflare.com www.acrossflare.com vault.acrossflare.com sync.acrossflare.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.acrossflare.com;

    include /etc/nginx/snippets/origin-ssl.conf;
    include /etc/nginx/origin-pulls.conf;

    return 301 https://acrossflare.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name acrossflare.com;

    include /etc/nginx/snippets/origin-ssl.conf;
    include /etc/nginx/origin-pulls.conf;
    include /etc/nginx/snippets/proxy-headers.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/v1/subscription {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_read_timeout 60s;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vault.acrossflare.com;

    include /etc/nginx/snippets/origin-ssl.conf;
    include /etc/nginx/origin-pulls.conf;
    include /etc/nginx/snippets/proxy-headers.conf;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $vault_upstream http://vaultwarden:80;
        proxy_pass $vault_upstream;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sync.acrossflare.com;

    include /etc/nginx/snippets/origin-ssl.conf;
    include /etc/nginx/origin-pulls.conf;
    include /etc/nginx/snippets/proxy-headers.conf;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sync_upstream http://syncthing:8384;
        proxy_pass $sync_upstream;
        proxy_read_timeout 120s;
    }
}
